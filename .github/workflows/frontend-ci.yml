name: Frontend CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - feature/**
      - develop
    paths:
      - frontend/**
      - .github/workflows/frontend-ci.yml
      - .github/workflows/deploy.yml
      - .github/workflows/serverless-production-frontend.yml
      - scripts/check-frontend-dist.sh
      - scripts/verify.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check frontend artifact
        run: ../scripts/check-frontend-dist.sh dist

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test frontend artifact
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm preview --host 127.0.0.1 --port 4173
        run: pnpm exec playwright test e2e/smoke-preview.spec.ts

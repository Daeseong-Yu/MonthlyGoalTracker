name: Serverless Production Frontend Deploy

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/serverless-production-frontend.yml
      - scripts/check-frontend-dist.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serverless-production-frontend
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify frontend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check frontend artifact
        run: ../scripts/check-frontend-dist.sh dist

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test frontend artifact
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm preview --host 127.0.0.1 --port 4173
        run: pnpm exec playwright test e2e/smoke-preview.spec.ts

      - name: Upload verified frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy frontend artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: serverless-production-prepare
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      AWS_PAGER: ""
    steps:
      - name: Download verified frontend artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-frontend-dist
          path: frontend/dist

      - name: Validate deploy context
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_REGION:?AWS_REGION variable is required}"
          : "${AWS_ROLE_TO_ASSUME:?AWS_ROLE_TO_ASSUME variable is required}"
          if [[ ! "${AWS_REGION}" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]; then
            echo "AWS_REGION must be an AWS region name." >&2
            exit 1
          fi
          if [[ "${AWS_ROLE_TO_ASSUME}" != arn:*:iam::*:role/* || "${AWS_ROLE_TO_ASSUME}" =~ [[:space:]] ]]; then
            echo "AWS_ROLE_TO_ASSUME must be an IAM role ARN." >&2
            exit 1
          fi
          echo "::add-mask::${AWS_ROLE_TO_ASSUME}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve frontend resources
        shell: bash
        run: |
          set -euo pipefail
          frontend_bucket="$(aws cloudformation describe-stack-resource \
            --stack-name "MonthlyGoalTracker-production" \
            --logical-resource-id FrontendBucket \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)"
          distribution_id="$(aws cloudformation describe-stack-resource \
            --stack-name "MonthlyGoalTracker-production" \
            --logical-resource-id FrontendDistribution \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)"
          if [[ -z "${frontend_bucket}" || "${frontend_bucket}" == "None" ]]; then
            echo "Production frontend bucket lookup failed." >&2
            exit 1
          fi
          if [[ -z "${distribution_id}" || "${distribution_id}" == "None" ]]; then
            echo "Production frontend distribution lookup failed." >&2
            exit 1
          fi
          echo "::add-mask::${frontend_bucket}"
          echo "::add-mask::${distribution_id}"
          echo "FRONTEND_BUCKET=${frontend_bucket}" >> "${GITHUB_ENV}"
          echo "FRONTEND_DISTRIBUTION_ID=${distribution_id}" >> "${GITHUB_ENV}"

      - name: Upload frontend artifact
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync frontend/dist "s3://${FRONTEND_BUCKET}/" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors
          aws s3 cp frontend/dist/index.html "s3://${FRONTEND_BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html" \
            --only-show-errors
          echo "Production frontend upload completed."

      - name: Invalidate CloudFront
        shell: bash
        run: |
          set -euo pipefail
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${FRONTEND_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"
          if [[ -z "${invalidation_id}" || "${invalidation_id}" == "None" ]]; then
            echo "Production frontend invalidation request failed." >&2
            exit 1
          fi
          echo "::add-mask::${invalidation_id}"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${FRONTEND_DISTRIBUTION_ID}" \
            --id "${invalidation_id}"
          echo "Production frontend invalidation completed."

  public-smoke:
    name: Smoke test public frontend
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: serverless-production-public
    permissions:
      contents: read
    env:
      SERVERLESS_SITE_BASE_URL: ${{ vars.SERVERLESS_SITE_BASE_URL }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate public smoke context
        shell: bash
        run: |
          set -euo pipefail
          : "${SERVERLESS_SITE_BASE_URL:?SERVERLESS_SITE_BASE_URL variable is required}"
          site_base_url="${SERVERLESS_SITE_BASE_URL%/}"
          if [[ ! "${site_base_url}" =~ ^https://[^/?#]+$ ]]; then
            echo "SERVERLESS_SITE_BASE_URL must be an absolute HTTPS origin without path, query, or fragment." >&2
            exit 1
          fi
          echo "::add-mask::${site_base_url}"
          echo "PLAYWRIGHT_BASE_URL=${site_base_url}" >> "${GITHUB_ENV}"
          echo "PLAYWRIGHT_SERVERLESS_SMOKE=1" >> "${GITHUB_ENV}"

      - name: Smoke test public frontend
        run: pnpm exec playwright test e2e/serverless-smoke.spec.ts

name: Infra CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - infra/**
      - .github/workflows/infra-ci.yml
      - .github/workflows/deploy.yml
      - .github/workflows/serverless-staging.yml
      - .github/workflows/serverless-production-prepare.yml
      - .github/workflows/serverless-production-frontend.yml
      - .github/workflows/serverless-production-migrate.yml
      - .github/workflows/serverless-production-public-smoke.yml
      - scripts/check-serverless-production-readiness.sh
      - scripts/test-serverless-production-readiness.sh
      - scripts/setup-serverless-production-post-deploy-iam.sh
      - scripts/test-serverless-production-post-deploy-iam.sh
  push:
    branches:
      - feature/**
      - develop
    paths:
      - infra/**
      - .github/workflows/infra-ci.yml
      - .github/workflows/deploy.yml
      - .github/workflows/serverless-staging.yml
      - .github/workflows/serverless-production-prepare.yml
      - .github/workflows/serverless-production-frontend.yml
      - .github/workflows/serverless-production-migrate.yml
      - .github/workflows/serverless-production-public-smoke.yml
      - scripts/check-serverless-production-readiness.sh
      - scripts/test-serverless-production-readiness.sh
      - scripts/setup-serverless-production-post-deploy-iam.sh
      - scripts/test-serverless-production-post-deploy-iam.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra:
    name: Infra
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Synthesize
        run: npx cdk synth --output /tmp/monthly-goal-tracker-infra-ci-synth > /tmp/monthly-goal-tracker-infra-ci-synth.yaml

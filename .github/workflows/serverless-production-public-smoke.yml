name: Serverless Production Public Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serverless-production-public-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke test public serverless production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: serverless-production-public
    env:
      SERVERLESS_SITE_BASE_URL: ${{ vars.SERVERLESS_SITE_BASE_URL }}
      PLAYWRIGHT_AUTH_EMAIL: ${{ secrets.SERVERLESS_SMOKE_EMAIL }}
      PLAYWRIGHT_AUTH_PASSWORD: ${{ secrets.SERVERLESS_SMOKE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate public smoke context
        shell: bash
        run: |
          set -euo pipefail
          : "${SERVERLESS_SITE_BASE_URL:?SERVERLESS_SITE_BASE_URL variable is required}"
          site_base_url="${SERVERLESS_SITE_BASE_URL%/}"
          if [[ ! "${site_base_url}" =~ ^https://[^/?#]+$ ]]; then
            echo "SERVERLESS_SITE_BASE_URL must be an absolute HTTPS origin without path, query, or fragment." >&2
            exit 1
          fi
          auth_email_set=false
          auth_password_set=false
          [[ -n "${PLAYWRIGHT_AUTH_EMAIL:-}" ]] && auth_email_set=true
          [[ -n "${PLAYWRIGHT_AUTH_PASSWORD:-}" ]] && auth_password_set=true
          if [[ "${auth_email_set}" != "${auth_password_set}" ]]; then
            echo "SERVERLESS_SMOKE_EMAIL and SERVERLESS_SMOKE_PASSWORD must be configured together." >&2
            exit 1
          fi
          echo "PLAYWRIGHT_BASE_URL=${site_base_url}" >> "${GITHUB_ENV}"
          echo "PLAYWRIGHT_SERVERLESS_SMOKE=1" >> "${GITHUB_ENV}"
          if [[ "${auth_email_set}" == "true" ]]; then
            echo "PLAYWRIGHT_SERVERLESS_AUTH_SMOKE=1" >> "${GITHUB_ENV}"
          fi

      - name: Smoke test public serverless site
        working-directory: frontend
        run: pnpm exec playwright test --grep "serverless"

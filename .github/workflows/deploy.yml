name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      component:
        description: Component to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - frontend

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect deploy targets
        id: detect
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          MANUAL_COMPONENT: ${{ github.event.inputs.component || 'all' }}
        run: |
          set -euo pipefail

          backend=false
          frontend=false

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Manual production deployments must run from main." >&2
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${MANUAL_COMPONENT:-all}" in
              all)
                backend=true
                frontend=true
                ;;
              backend)
                backend=true
                ;;
              frontend)
                frontend=true
                ;;
            esac
          else
            if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
              BEFORE_SHA="$(git rev-list --max-parents=0 "${AFTER_SHA}")"
            fi

            while IFS= read -r file; do
              case "${file}" in
                backend/*)
                  backend=true
                  ;;
                frontend/*)
                  frontend=true
                  ;;
                deploy/scripts/deploy-backend.sh)
                  backend=true
                  ;;
                deploy/scripts/deploy-frontend.sh)
                  frontend=true
                  ;;
                scripts/check-frontend-dist.sh)
                  frontend=true
                  ;;
                .github/workflows/deploy.yml)
                  backend=true
                  frontend=true
                  ;;
              esac
            done < <(git diff --name-only "${BEFORE_SHA}" "${AFTER_SHA}")
          fi

          echo "backend=${backend}" >> "${GITHUB_OUTPUT}"
          echo "frontend=${frontend}" >> "${GITHUB_OUTPUT}"
          echo "backend=${backend} frontend=${frontend}"

  build-backend:
    name: Build backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test
        run: go test ./...

      - name: Build Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist/backend
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../dist/backend/monthly-goal-api-linux-amd64 ./cmd/api
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../dist/backend/monthly-goal-api-linux-arm64 ./cmd/api

      - name: Copy backend deploy script
        shell: bash
        run: |
          set -euo pipefail
          install -m 0755 ../deploy/scripts/deploy-backend.sh ../dist/backend/deploy-backend.sh

      - name: Upload backend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-binaries
          path: dist/backend
          if-no-files-found: error

  build-frontend:
    name: Build frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check frontend artifact
        run: ../scripts/check-frontend-dist.sh dist

      - name: Package frontend dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist/frontend
          tar -C dist -czf ../dist/frontend/frontend-dist.tar.gz .
          install -m 0755 ../deploy/scripts/deploy-frontend.sh ../dist/frontend/deploy-frontend.sh

      - name: Upload frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: dist/frontend
          if-no-files-found: error

  deploy-backend:
    name: Deploy backend
    needs:
      - changes
      - build-backend
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-binaries
          path: dist/backend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload backend artifacts to S3
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          DEPLOY_ARTIFACT_BUCKET: ${{ vars.DEPLOY_ARTIFACT_BUCKET }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          aws s3 cp dist/backend "s3://${DEPLOY_ARTIFACT_BUCKET}/releases/${RELEASE_ID}/backend/" --recursive --region "${AWS_REGION}"

      - name: Deploy backend with SSM
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          DEPLOY_ARTIFACT_BUCKET: ${{ vars.DEPLOY_ARTIFACT_BUCKET }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cat > backend-ssm-parameters.json <<EOF
          {
            "commands": [
              "aws s3 cp s3://${DEPLOY_ARTIFACT_BUCKET}/releases/${RELEASE_ID}/backend/deploy-backend.sh /tmp/monthly-goal-tracker-deploy-backend.sh --region ${AWS_REGION}",
              "chmod 0755 /tmp/monthly-goal-tracker-deploy-backend.sh",
              "DEPLOY_ARTIFACT_BUCKET=${DEPLOY_ARTIFACT_BUCKET} RELEASE_ID=${RELEASE_ID} AWS_REGION=${AWS_REGION} /tmp/monthly-goal-tracker-deploy-backend.sh"
            ]
          }
          EOF

          command_id="$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Monthly Goal Tracker backend ${RELEASE_ID}" \
            --parameters file://backend-ssm-parameters.json \
            --region "${AWS_REGION}" \
            --query "Command.CommandId" \
            --output text)"

          if ! aws ssm wait command-executed --command-id "${command_id}" --instance-id "${EC2_INSTANCE_ID}" --region "${AWS_REGION}"; then
            echo "Backend SSM deploy failed. Invocation summary:" >&2
            aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --region "${AWS_REGION}" \
              --query '{Status:Status,ResponseCode:ResponseCode}' \
              --output json >&2 || true
            exit 1
          fi
          echo "Backend deploy completed."

  deploy-frontend:
    name: Deploy frontend
    needs:
      - changes
      - build-frontend
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: dist/frontend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload frontend artifacts to S3
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          DEPLOY_ARTIFACT_BUCKET: ${{ vars.DEPLOY_ARTIFACT_BUCKET }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          aws s3 cp dist/frontend "s3://${DEPLOY_ARTIFACT_BUCKET}/releases/${RELEASE_ID}/frontend/" --recursive --region "${AWS_REGION}"

      - name: Deploy frontend with SSM
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          DEPLOY_ARTIFACT_BUCKET: ${{ vars.DEPLOY_ARTIFACT_BUCKET }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cat > frontend-ssm-parameters.json <<EOF
          {
            "commands": [
              "aws s3 cp s3://${DEPLOY_ARTIFACT_BUCKET}/releases/${RELEASE_ID}/frontend/deploy-frontend.sh /tmp/monthly-goal-tracker-deploy-frontend.sh --region ${AWS_REGION}",
              "chmod 0755 /tmp/monthly-goal-tracker-deploy-frontend.sh",
              "DEPLOY_ARTIFACT_BUCKET=${DEPLOY_ARTIFACT_BUCKET} RELEASE_ID=${RELEASE_ID} AWS_REGION=${AWS_REGION} /tmp/monthly-goal-tracker-deploy-frontend.sh"
            ]
          }
          EOF

          command_id="$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Monthly Goal Tracker frontend ${RELEASE_ID}" \
            --parameters file://frontend-ssm-parameters.json \
            --region "${AWS_REGION}" \
            --query "Command.CommandId" \
            --output text)"

          if ! aws ssm wait command-executed --command-id "${command_id}" --instance-id "${EC2_INSTANCE_ID}" --region "${AWS_REGION}"; then
            echo "Frontend SSM deploy failed. Invocation summary:" >&2
            aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --region "${AWS_REGION}" \
              --query '{Status:Status,ResponseCode:ResponseCode}' \
              --output json >&2 || true
            exit 1
          fi
          echo "Frontend deploy completed."

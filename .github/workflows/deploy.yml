name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      component:
        description: Component to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - frontend

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect deploy targets
        id: detect
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          MANUAL_COMPONENT: ${{ github.event.inputs.component || 'all' }}
        run: |
          set -euo pipefail

          backend=false
          frontend=false

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Manual production deployments must run from main." >&2
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${MANUAL_COMPONENT:-all}" in
              all)
                backend=true
                frontend=true
                ;;
              backend)
                backend=true
                ;;
              frontend)
                frontend=true
                ;;
            esac
          else
            if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
              BEFORE_SHA="$(git rev-list --max-parents=0 "${AFTER_SHA}")"
            fi

            while IFS= read -r file; do
              case "${file}" in
                backend/*)
                  backend=true
                  ;;
                frontend/*)
                  frontend=true
                  ;;
              esac
            done < <(git diff --name-only "${BEFORE_SHA}" "${AFTER_SHA}")
          fi

          echo "backend=${backend}" >> "${GITHUB_OUTPUT}"
          echo "frontend=${frontend}" >> "${GITHUB_OUTPUT}"
          echo "backend=${backend} frontend=${frontend}"

  build-backend:
    name: Build backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test
        run: go test ./...

      - name: Build Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist/backend
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../dist/backend/monthly-goal-api-linux-amd64 ./cmd/api
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../dist/backend/monthly-goal-api-linux-arm64 ./cmd/api

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binaries
          path: dist/backend
          if-no-files-found: error

  build-frontend:
    name: Build frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deploy-backend:
    name: Deploy backend
    needs:
      - changes
      - build-backend
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-binaries
          path: dist/backend

      - name: Configure SSH
        shell: bash
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${EC2_SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          printf '%s\n' "${EC2_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Upload backend binary
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          RELEASE_DIR: /tmp/monthly-goal-tracker-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          SSH_PORT="${EC2_SSH_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "mkdir -p '${RELEASE_DIR}/backend'"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT} -o IdentitiesOnly=yes" dist/backend/ "${EC2_USER}@${EC2_HOST}:${RELEASE_DIR}/backend/"

      - name: Restart backend
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          RELEASE_DIR: /tmp/monthly-goal-tracker-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          SSH_PORT="${EC2_SSH_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "RELEASE_DIR='${RELEASE_DIR}' bash -s" <<'REMOTE'
          set -euo pipefail

          case "$(uname -m)" in
            x86_64)
              artifact="monthly-goal-api-linux-amd64"
              ;;
            aarch64|arm64)
              artifact="monthly-goal-api-linux-arm64"
              ;;
            *)
              echo "unsupported server architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          release_root="/opt/monthly-goal-tracker/backend/releases"
          release_name="$(basename "${RELEASE_DIR}")"
          release_dir="${release_root}/${release_name}"
          current_binary="/opt/monthly-goal-tracker/backend/monthly-goal-api"
          previous_binary=""

          install -d -m 0755 "${release_root}"
          rm -rf "${release_dir}"
          mkdir -p "${release_dir}"
          install -m 0755 "${RELEASE_DIR}/backend/${artifact}" "${release_dir}/monthly-goal-api"

          if [ -L "${current_binary}" ]; then
            previous_binary="$(readlink -f "${current_binary}")"
          elif [ -f "${current_binary}" ]; then
            previous_dir="${release_root}/pre-cicd-$(date +%Y%m%d%H%M%S)"
            mkdir -p "${previous_dir}"
            cp "${current_binary}" "${previous_dir}/monthly-goal-api"
            chmod 0755 "${previous_dir}/monthly-goal-api"
            previous_binary="${previous_dir}/monthly-goal-api"
          fi

          ln -sfn "${release_dir}/monthly-goal-api" "${current_binary}.next"
          mv -Tf "${current_binary}.next" "${current_binary}"

          if sudo systemctl restart monthly-goal-api; then
            for _ in $(seq 1 10); do
              if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then
                cd "${release_root}"
                ls -1dt */ 2>/dev/null | tail -n +6 | while IFS= read -r old_release; do
                  rm -rf -- "${release_root}/${old_release%/}"
                done
                exit 0
              fi
              sleep 2
            done
          fi

          if [ -n "${previous_binary}" ] && [ -x "${previous_binary}" ]; then
            ln -sfn "${previous_binary}" "${current_binary}.next"
            mv -Tf "${current_binary}.next" "${current_binary}"
            sudo systemctl restart monthly-goal-api || true
          fi

          systemctl status monthly-goal-api --no-pager
          exit 1
          REMOTE

      - name: Clean backend staging directory
        if: always()
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          RELEASE_DIR: /tmp/monthly-goal-tracker-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -u
          SSH_PORT="${EC2_SSH_PORT:-22}"
          if [ ! -f ~/.ssh/deploy_key ]; then
            exit 0
          fi
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "rm -rf -- '${RELEASE_DIR}/backend'; rmdir -- '${RELEASE_DIR}' 2>/dev/null || true" || true

  deploy-frontend:
    name: Deploy frontend
    needs:
      - changes
      - build-frontend
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/frontend

      - name: Configure SSH
        shell: bash
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${EC2_SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          printf '%s\n' "${EC2_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Upload frontend dist
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          RELEASE_DIR: /tmp/monthly-goal-tracker-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          SSH_PORT="${EC2_SSH_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "mkdir -p '${RELEASE_DIR}/frontend/dist'"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT} -o IdentitiesOnly=yes" dist/frontend/ "${EC2_USER}@${EC2_HOST}:${RELEASE_DIR}/frontend/dist/"

      - name: Activate frontend release
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          RELEASE_DIR: /tmp/monthly-goal-tracker-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_NAME: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          SSH_PORT="${EC2_SSH_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "RELEASE_DIR='${RELEASE_DIR}' RELEASE_NAME='${RELEASE_NAME}' bash -s" <<'REMOTE'
          set -euo pipefail

          release_root="/opt/monthly-goal-tracker/frontend/releases"
          release_dir="${release_root}/${RELEASE_NAME}"

          install -d -m 0755 "${release_root}"
          rm -rf "${release_dir}"
          mkdir -p "${release_dir}"
          cp -a "${RELEASE_DIR}/frontend/dist/." "${release_dir}/"
          test -f "${release_dir}/index.html"

          current_dist="/opt/monthly-goal-tracker/frontend/dist"
          if [ -d "${current_dist}" ] && [ ! -L "${current_dist}" ]; then
            mv "${current_dist}" "${release_root}/pre-cicd-$(date +%Y%m%d%H%M%S)"
          fi

          ln -sfn "${release_dir}" "${current_dist}.next"
          mv -Tf "${current_dist}.next" "${current_dist}"

          cd "${release_root}"
          ls -1dt */ 2>/dev/null | tail -n +6 | while IFS= read -r old_release; do
            rm -rf -- "${release_root}/${old_release%/}"
          done
          REMOTE

      - name: Clean frontend staging directory
        if: always()
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          RELEASE_DIR: /tmp/monthly-goal-tracker-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -u
          SSH_PORT="${EC2_SSH_PORT:-22}"
          if [ ! -f ~/.ssh/deploy_key ]; then
            exit 0
          fi
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "rm -rf -- '${RELEASE_DIR}/frontend'; rmdir -- '${RELEASE_DIR}' 2>/dev/null || true" || true
